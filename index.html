<style>
  :root{
    --teal:#47D7AC;
    --orange:#FDAA63;
    --purple:#7566A0;
    --sky:#99D6EA;
    --ink:#0B0B0C;
    --pale:#F1EB9C;
    --gold:#FFD637;
    --paper:#FFFFFF;
    --line:#E7E5DE;
    --wash:#FAFAF7;
    --shadow: 0 1px 2px rgba(11,11,12,.04), 0 6px 16px rgba(11,11,12,.05);
    --radius: 14px;
    --font-display:'Lexend', system-ui, sans-serif;
    --font-body:'Lexend', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 500px at 100% -10%, rgba(153,214,234,.25), transparent 60%),
      radial-gradient(900px 400px at -10% 110%, rgba(255,214,55,.18), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
  }
  ::selection{background:var(--teal); color:#fff;}
  button{font-family:inherit; cursor:pointer;}
  textarea, input{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Bubble decoration ---------- */
  .bubbles{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .bubbles span{
    position:absolute; bottom:-40px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(71,215,172,.12));
    border:1px solid rgba(71,215,172,.25);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(1); opacity:0;}
    10%{opacity:.6;}
    100%{transform:translateY(-115vh) scale(1.15); opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){ .bubbles{display:none;} }

  /* ---------- Page wrapper ---------- */
  .page{position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:0 22px;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; row-gap:10px;
    padding:14px 0 12px;
    background:rgba(250,250,247,.9);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .logo{width:40px; height:40px; flex:0 0 auto;}
  .logo svg{width:100%; height:100%; display:block;}
  .brand{display:flex; flex-direction:column; line-height:1.05;}
  .brand .kicker{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--purple); font-weight:600;
  }
  .brand h1{
    font-family:var(--font-display); font-size:22px; margin:2px 0 0; font-weight:700; letter-spacing:-.01em;
  }
  header .spacer{flex:1;}
  .pill{
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--font-mono); font-size:11.5px; font-weight:600;
    padding:7px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--wash); white-space:nowrap;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:#C9C6BB; flex:0 0 auto;}
  .dot.live{background:var(--teal); box-shadow:0 0 0 3px rgba(71,215,172,.22);}
  .dot.local{background:var(--gold); box-shadow:0 0 0 3px rgba(255,214,55,.22);}
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .btn:hover{border-color:var(--purple); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--purple); outline-offset:2px;
  }
  .btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn.primary:hover{background:var(--purple); border-color:var(--purple);}
  .btn.ghost{background:transparent;}
  .btn svg{width:15px; height:15px; flex:0 0 auto;}
  header .actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-left:8px;}

  /* ---------- Meta bar ---------- */
  .metabar{
    margin:16px 0 18px; padding:12px 18px;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    display:flex; gap:26px; align-items:center; flex-wrap:wrap;
    box-shadow:var(--shadow);
  }
  .field{display:flex; align-items:center; gap:8px;}
  .field label{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em;
    color:#7a776c; font-weight:600;
  }
  .field input{
    border:none; border-bottom:1.5px solid var(--line); background:transparent;
    padding:3px 2px; font-size:14px; font-weight:600; color:var(--ink); min-width:90px;
  }
  .field input:focus{border-color:var(--teal); outline:none;}
  .metabar .sep{width:1px; height:20px; background:var(--line);}

  /* ---------- Main grid ---------- */
  main{
    display:grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-areas:
      "safety lab side"
      "production comments side"
      "attendance attendance attendance";
    align-items:stretch;
    gap:16px;
    margin-bottom:40px;
  }
  #card-safety{grid-area:safety;}
  #card-lab{grid-area:lab;}
  #card-production{grid-area:production;}
  #card-comments{grid-area:comments;}
  #card-attendance{grid-area:attendance;}
  .side-stack{
    grid-area:side; align-self:start;
    display:flex; flex-direction:column; gap:16px; min-width:0;
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); display:flex; flex-direction:column;
    overflow:hidden; position:relative;
  }
  #card-safety, #card-lab, #card-production, #card-comments, #card-priority{min-height:380px;}
  .card > .bar{height:4px; flex:0 0 auto;}
  .card .head{
    display:flex; align-items:center; gap:8px; padding:12px 16px 8px; flex:0 0 auto;
  }
  .card .head h2{
    font-family:var(--font-display); font-size:14px; font-weight:700; margin:0;
    letter-spacing:.01em;
  }
  .card .head .icon{width:17px; height:17px; flex:0 0 auto;}
  .card .head .tag{
    margin-left:auto; font-family:var(--font-mono); font-size:9.5px; color:#9c9887;
    text-transform:uppercase; letter-spacing:.08em;
  }
  .card .head .head-right{
    margin-left:auto; display:flex; align-items:center; gap:10px;
  }
  .card .body{padding:4px 16px 16px; flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}

  #card-safety .bar{background:var(--teal);}
  #card-workload .bar{background:var(--orange);}
  #card-priority .bar{background:var(--purple);}
  #card-lab .bar{background:var(--sky);}
  #card-comments .bar{background:#D8CC5A;}
  #card-production .bar{background:var(--gold);}
  #card-attendance .bar{background:var(--purple);}
  /* #card-kpi .bar{background:var(--purple);} — KPI section paused, see commented block below */

  textarea.note{
    width:100%; height:100%; min-height:120px; resize:vertical; border:none;
    background:var(--wash); border-radius:9px; padding:10px 11px;
    font-size:13.5px; line-height:1.5; color:var(--ink);
  }
  textarea.note:focus{outline:2px solid var(--teal); outline-offset:0;}
  textarea.note::placeholder{color:#a9a596;}

  /* Prioritized task checklist */
  .task-list{display:flex; flex-direction:column; gap:2px;}
  .task-row{
    display:flex; align-items:center; gap:8px; padding:5px 4px; border-radius:6px; cursor:pointer;
  }
  .task-row:hover{background:var(--wash);}
  .task-check{width:15px; height:15px; accent-color:var(--purple); flex:0 0 auto; cursor:pointer;}
  .task-label{font-size:11.5px; font-weight:700; width:132px; flex:0 0 auto; color:var(--ink);}
  .task-row.checked .task-label{color:#9a97c9; text-decoration:line-through;}
  .task-note{
    flex:1; min-width:0; border:none; border-bottom:1.5px solid var(--line); background:transparent;
    font-size:11.5px; padding:3px 2px; color:var(--ink);
  }
  .task-note:focus{outline:none; border-color:var(--purple);}
  .task-note::placeholder{color:#b3b0a2;}

  /* Workload options */
  .workload-opts{display:flex; flex-direction:column; gap:8px;}
  .workload-opt{
    text-align:left; padding:11px 12px; border-radius:9px; border:1.5px solid var(--line);
    font-size:13px; font-weight:700; background:#fff; color:#6b6858; transition:.12s ease;
    display:flex; align-items:center; gap:9px;
  }
  .workload-opt .swatch{width:10px; height:10px; border-radius:50%; background:var(--line); flex:0 0 auto;}
  .workload-opt:hover{border-color:var(--orange);}
  .workload-opt.active{background:rgba(253,170,99,.14); border-color:var(--orange); color:var(--ink);}
  .workload-opt.active .swatch{background:var(--orange);}

  /* KPI gauges */
  .kpi-table{width:100%; border-collapse:separate; border-spacing:5px;}
  .kpi-table th{
    font-family:var(--font-mono); font-size:10px; color:#8b8878; font-weight:600;
    text-transform:uppercase; letter-spacing:.05em; padding-bottom:2px;
  }
  .kpi-table td.rowlabel{
    font-family:var(--font-display); font-size:12px; font-weight:700; white-space:nowrap; padding-right:4px;
  }
  .gauge{
    width:100%; aspect-ratio:1/.82; border-radius:9px; border:1.5px solid var(--line);
    background:var(--wash); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; transition:.15s ease; position:relative;
  }
  .gauge:hover{transform:translateY(-1px); box-shadow:0 3px 8px rgba(11,11,12,.08);}
  .gauge .dial{width:18px; height:18px;}
  .gauge .state{font-family:var(--font-mono); font-size:8px; font-weight:700; letter-spacing:.04em;}
  .gauge[data-state="pending"]{background:var(--wash); border-color:var(--line);}
  .gauge[data-state="pending"] .state{color:#a9a596;}
  .gauge[data-state="pass"]{background:rgba(71,215,172,.16); border-color:var(--teal);}
  .gauge[data-state="pass"] .state{color:#1f7a5c;}
  .gauge[data-state="watch"]{background:rgba(255,214,55,.22); border-color:var(--gold);}
  .gauge[data-state="watch"] .state{color:#8a6d00;}
  .gauge[data-state="fail"]{background:rgba(117,102,160,.16); border-color:var(--purple);}
  .gauge[data-state="fail"] .state{color:var(--purple);}
  .kpi-legend{display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .kpi-legend span{display:flex; align-items:center; gap:5px; font-size:10px; color:#7a776c; font-family:var(--font-mono);}
  .kpi-legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .attendance-row{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:6px 8px 6px 6px; border-radius:999px; border:1.5px solid #D9D6CB;
    background:#EDEBE3; color:#5c594e; font-size:12.5px; font-weight:600; white-space:nowrap;
    transition:.12s ease;
  }
  .chip:hover{border-color:#c7c3b3;}
  .chip .avatar{
    width:18px; height:18px; border-radius:50%; background:#D9D6CB; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#5c594e;
  }
  .chip.present{border-color:var(--teal); background:rgba(71,215,172,.18); color:#14523d;}
  .chip.present .avatar{background:var(--teal); color:#04241a;}
  .chip .rm{
    border:none; background:none; color:#b3b0a2; font-size:13px; line-height:1; padding:0 2px;
  }
  .chip .rm:hover{color:var(--purple);}
  .add-chip{
    flex:0 0 auto; border:1.5px dashed var(--line); background:transparent; border-radius:999px;
    padding:6px 12px; font-size:12.5px; font-weight:700; color:#8b8878;
  }
  .add-chip:hover{border-color:var(--teal); color:var(--teal);}

  @media (max-width: 900px){
    main{
      grid-template-columns: 1fr;
      grid-template-areas:
        "safety"
        "lab"
        "side"
        "production"
        "comments"
        "attendance";
    }
    #card-safety, #card-lab, #card-production, #card-comments, #card-priority{min-height:0;}
  }

  @media (max-width: 640px){
    header{padding:12px 0 10px;}
    header .actions{margin-left:0; width:100%;}
    .metabar{gap:16px;}
  }

  /* ---------- Print / PDF sheet ---------- */
  .print-sheet{display:none;}
  @media print{
    @page{ margin:16mm; }
    body{height:auto; overflow:visible; background:#fff;}
    .bubbles, .page{display:none !important;}
    .print-sheet{display:block !important;}
    .print-sheet h1{font-family:var(--font-display); font-size:21px; margin:0 0 2px; font-weight:700;}
    .print-sheet .ps-meta{
      font-family:var(--font-mono); font-size:10.5px; color:#333; margin-bottom:16px;
      display:flex; gap:18px; flex-wrap:wrap;
    }
    .print-sheet section{margin-bottom:13px; page-break-inside:avoid;}
    .print-sheet h3{
      font-family:var(--font-display); font-size:12.5px; font-weight:700; margin:0 0 4px;
      padding-bottom:3px; border-bottom:2px solid #000; text-transform:uppercase; letter-spacing:.03em;
    }
    .print-sheet .s-safety h3{border-color:#1f9c74;}
    .print-sheet .s-workload h3{border-color:#c97a2c;}
    .print-sheet .s-priority h3{border-color:#7566A0;}
    .print-sheet .s-lab h3{border-color:#3f8ba3;}
    .print-sheet .s-comments h3{border-color:#a89412;}
    .print-sheet .s-production h3{border-color:#a3860a;}
    .print-sheet .s-attendance h3{border-color:#000;}
    .print-sheet p{font-size:11.5px; line-height:1.55; margin:0; white-space:pre-wrap;}
    .print-sheet .ps-attendees{display:flex; flex-wrap:wrap; gap:6px 16px; padding:0; margin:0; list-style:none;}
    .print-sheet .ps-attendees li{font-size:11.5px;}
    .print-sheet .ps-footer{margin-top:18px; font-family:var(--font-mono); font-size:9.5px; color:#777;}
  }
</style>
</head>
<body>

<div class="bubbles" id="bubbles" aria-hidden="true"></div>

<div class="page">

<header>
  <div class="logo" id="logoSlot"></div>
  <div class="brand">
    <span class="kicker">Daily Run Sheet</span>
    <h1>13:30 Handover Meeting</h1>
  </div>
  <div class="spacer"></div>
  <div class="actions">
    <button class="btn ghost" id="resetBtn" title="Clear the sheet for a new meeting">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 20v-5h5"/></svg>
      New meeting
    </button>
    <button class="btn ghost" id="pdfBtn" title="Download as PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Download PDF
    </button>
    <button class="btn primary" id="exportBtn" title="Copy a formatted summary to paste into an email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span id="exportBtnLabel">Copy for email</span>
    </button>
    <form method="POST" action="/logout" style="margin:0; display:contents;">
      <button type="submit" class="btn ghost" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Log out
      </button>
    </form>
  </div>
</header>

<div class="metabar">
  <div class="field"><label>Meeting lead</label><input id="f-lead" placeholder="Name"></div>
  <div class="sep"></div>
  <div class="field"><label>Date</label><input id="f-date" type="date"></div>
  <div class="sep"></div>
  <div class="field"><label>Start</label><input id="f-start" type="time"></div>
  <div class="sep"></div>
  <div class="field"><label>Finish</label><input id="f-finish" type="time"></div>
</div>

<main>
  <section class="card" id="card-safety">
    <div class="bar"></div>
    <div class="head">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#47D7AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"/></svg>
      <h2>Safety</h2>
    </div>
    <div class="body"><textarea class="note" id="f-safety" placeholder="Incidents, hazards, near misses, PPE reminders…"></textarea></div>
  </section>

  <section class="card" id="card-lab">
    <div class="bar"></div>
    <div class="head">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#5AA9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6.5L4.7 18a1.8 1.8 0 0 0 1.5 2.8h11.6a1.8 1.8 0 0 0 1.5-2.8L14 9.5V3"/><path d="M7.5 15h9"/></svg>
      <h2>Lab</h2>
    </div>
    <div class="body"><textarea class="note" id="f-lab" placeholder="Gravity readings, pH, QC results…"></textarea></div>
  </section>

  <div class="side-stack">
    <section class="card" id="card-workload">
      <div class="bar"></div>
      <div class="head">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#FDAA63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <h2>Workload</h2>
      </div>
      <div class="body">
        <div class="workload-opts" id="workloadOpts">
          <button class="workload-opt" data-v="none"><span class="swatch"></span>No problem</button>
          <button class="workload-opt" data-v="consistent"><span class="swatch"></span>Consistent</button>
          <button class="workload-opt" data-v="busy"><span class="swatch"></span>Going to be busy</button>
        </div>
      </div>
    </section>

    <section class="card" id="card-priority">
      <div class="bar"></div>
      <div class="head">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#7566A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <h2>Prioritized tasks</h2>
      </div>
      <div class="body">
        <div class="task-list" id="taskList">
          <label class="task-row" data-task="transfer"><input type="checkbox" class="task-check"><span class="task-label">Transfer</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="cipFV"><input type="checkbox" class="task-check"><span class="task-label">CIP FV</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="cipBBT"><input type="checkbox" class="task-check"><span class="task-label">CIP BBT</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="cipGBLine"><input type="checkbox" class="task-check"><span class="task-label">CIP GB Line</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="cipYeastLine"><input type="checkbox" class="task-check"><span class="task-label">CIP Yeast Line</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="cipBrewhouse"><input type="checkbox" class="task-check"><span class="task-label">CIP Brewhouse</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="acidWash"><input type="checkbox" class="task-check"><span class="task-label">Acid Wash</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="tempDrop"><input type="checkbox" class="task-check"><span class="task-label">Temp Drop</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="yeastOff"><input type="checkbox" class="task-check"><span class="task-label">Yeast Off</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="dryHop"><input type="checkbox" class="task-check"><span class="task-label">Dry Hop</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="millIn"><input type="checkbox" class="task-check"><span class="task-label">Mill In</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="cleaning"><input type="checkbox" class="task-check"><span class="task-label">Cleaning</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="sops"><input type="checkbox" class="task-check"><span class="task-label">SOPs</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="grainBills"><input type="checkbox" class="task-check"><span class="task-label">Make up grain bills</span><input type="text" class="task-note" placeholder="Details…"></label>
          <label class="task-row" data-task="other"><input type="checkbox" class="task-check"><span class="task-label">Other</span><input type="text" class="task-note" placeholder="Details…"></label>
        </div>
      </div>
    </section>
  </div>

  <!-- KPI section paused (may be restored later) — markup kept here for easy re-enabling.
  <section class="card full" id="card-kpi">
    <div class="bar"></div>
    <div class="head">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#7566A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V9l6-5 6 5v12"/><path d="M10 21v-6h4v6"/></svg>
      <h2>KPI — Spec compliance drill down</h2>
      <span class="tag">tap a gauge to update</span>
    </div>
    <div class="body">
      <table class="kpi-table" id="kpiTable">
        <thead><tr><th></th><th>XPA</th><th>CPT</th><th>IPA</th><th>HAZY</th><th>EAZY</th></tr></thead>
        <tbody>
          <tr data-row="brewhouse">
            <td class="rowlabel">Brewhouse</td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
          </tr>
          <tr data-row="fermentation">
            <td class="rowlabel">Fermentation</td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
            <td><button class="gauge" data-state="pending"><svg class="dial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12 8 15"/></svg><span class="state">—</span></button></td>
          </tr>
        </tbody>
      </table>
      <div class="kpi-legend">
        <span><i style="background:#D8D5C8"></i>Not tested</span>
        <span><i style="background:#47D7AC"></i>In spec</span>
        <span><i style="background:#FFD637"></i>Watch</span>
        <span><i style="background:#7566A0"></i>Out of spec</span>
      </div>
    </div>
  </section>
  -->

  <section class="card" id="card-production">
    <div class="bar"></div>
    <div class="head">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#B69200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l5-5 5 5v12"/><path d="M14 21v-7l4-4 2 2v9"/></svg>
      <h2>Production / Maintenance / Planning</h2>
    </div>
    <div class="body"><textarea class="note" id="f-production" placeholder="Batches, downtime, upcoming jobs…"></textarea></div>
  </section>

  <section class="card" id="card-comments">
    <div class="bar"></div>
    <div class="head">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#a89412" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <h2>Comments / issues — next 24 hrs</h2>
    </div>
    <div class="body"><textarea class="note" id="f-comments" placeholder="Anything the next shift needs to know…"></textarea></div>
  </section>

  <section class="card" id="card-attendance">
    <div class="bar"></div>
    <div class="head">

<script>
(function(){
  "use strict";

  /* ---------------- Logo ---------------- */
  document.getElementById('logoSlot').innerHTML = `
  <svg viewBox="0 0 161 161" xmlns="http://www.w3.org/2000/svg">
    <path fill="#47D7AC" d="M136.3,70.4l-9.4-9.4c-1.6-1.6-4.3-1.6-6,0-1.6,1.6-1.6,4.3,0,6l2.3,2.3c-9.6,13.2-25.2,21.7-42.7,21.7s-33.1-8.6-42.7-21.8l2.3-2.3c1.6-1.6,1.6-4.3,0-6-1.6-1.6-4.3-1.6-6,0l-9.4,9.4c-1.6,1.6-1.6,4.3,0,6,.8.8,1.9,1.2,3,1.2s2.2-.4,3-1.2l1.1-1.1c11.2,14.7,28.9,24.2,48.7,24.2s37.5-9.5,48.7-24.2l1.1,1.1c.8.8,1.9,1.2,3,1.2s2.2-.4,3-1.2c1.6-1.6,1.6-4.3,0-6"/>
    <path fill="#47D7AC" d="M152.5,8.5v144H8.5V8.5h144M161,0H0v161h161V0h0Z"/>
  </svg>`;

  /* ---------------- Bubbles decoration ---------------- */
  var bwrap = document.getElementById('bubbles');
  for (var i=0;i<10;i++){
    var b = document.createElement('span');
    var size = 6 + Math.random()*16;
    b.style.width = size+'px'; b.style.height = size+'px';
    b.style.left = (Math.random()*100)+'%';
    b.style.animationDuration = (14 + Math.random()*16)+'s';
    b.style.animationDelay = (Math.random()*-20)+'s';
    bwrap.appendChild(b);
  }

  /* ---------------- State ---------------- */
  var TASK_TYPES = [
    {key:'transfer', label:'Transfer'},
    {key:'cipFV', label:'CIP FV'},
    {key:'cipBBT', label:'CIP BBT'},
    {key:'cipGBLine', label:'CIP GB Line'},
    {key:'cipYeastLine', label:'CIP Yeast Line'},
    {key:'cipBrewhouse', label:'CIP Brewhouse'},
    {key:'acidWash', label:'Acid Wash'},
    {key:'tempDrop', label:'Temp Drop'},
    {key:'yeastOff', label:'Yeast Off'},
    {key:'dryHop', label:'Dry Hop'},
    {key:'millIn', label:'Mill In'},
    {key:'cleaning', label:'Cleaning'},
    {key:'sops', label:'SOPs'},
    {key:'grainBills', label:'Make up grain bills'},
    {key:'other', label:'Other'}
  ];

  var ROSTER = [
    'Anthony D','Barry T','Blake W','Callum M','Carolina G','Corey C',
    'David C','Ella K','Gavin M','Izaak S','Jacob G',
    'Jayke P','Jesse L','Joey K','John W','Julien N',
    'Justin B','Kieron Y','Layla V','Mark G','Mark P',
    'Maryanne W','Nick W','Pablo E','Paul B','Paulo R',
    'Ryan H','Shannon W','Thiago M','Tim B','Tom N',
    'Trent E','Tristan F','Will D','William E','Zach W'
  ];

  function todayStr(){
    var d = new Date();
    var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }

  var defaultState = function(){
    var priorityTasks = {};
    TASK_TYPES.forEach(function(t){ priorityTasks[t.key] = {checked:false, notes:""}; });
    return {
      lead:"", date:todayStr(), start:"", finish:"",
      safety:"",
      lab:"",
      workload:{status:"none"},
      priorityTasks:priorityTasks,
      comments:"",
      production:"",
      /* kpi section paused — restore this block (and the matching HTML/CSS/JS marked
         "KPI section paused") to bring it back:
      kpi:{
        brewhouse:{XPA:"pending",CPT:"pending",IPA:"pending",HAZY:"pending",EAZY:"pending"},
        fermentation:{XPA:"pending",CPT:"pending",IPA:"pending",HAZY:"pending",EAZY:"pending"}
      },
      */
      attendance: ROSTER.map(function(name){ return {name:name, present:false, roster:true}; }),
      updatedAt:0
    };
  };
  var state = defaultState();
  var dirty = false;         // local unsynced change pending
  var pushTimer = null;

  /* ---------------- Sync setup ----------------
     All multi-device sync goes through the same-origin /api/sync endpoint,
     which the Cloudflare Worker proxies to JSONBin.io server-side. The
     browser never sees the JSONBin Bin ID or API key. There's no per-room
     concept any more — everyone signed in shares the one run sheet. */
  var CACHE_KEY = 'sb-runsheet-cache';

  function qs(sel){ return document.querySelector(sel); }

  function setSyncStatus(mode, label){
    // Sync status pill removed from the UI — sync itself still runs in the background.
  }

  async function remoteGet(){
    var res = await fetch('/api/sync', {method:'GET', credentials:'same-origin', cache:'no-store'});
    if(res.status === 401){ location.href = '/login'; return null; }
    if(!res.ok) throw new Error('sync get failed');
    var data = await res.json();
    return (data && typeof data === 'object' && Object.keys(data).length) ? data : null;
  }

  async function remoteSet(data){
    var res = await fetch('/api/sync', {
      method:'PUT',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if(res.status === 401){ location.href = '/login'; return; }
    if(!res.ok) throw new Error('sync set failed');
  }

  /* ---------------- Local cache ---------------- */
  function saveLocal(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }catch(e){} }
  function loadLocal(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }

  /* ---------------- Render ---------------- */
  function render(){
    qs('#f-lead').value = state.lead||'';
    qs('#f-date').value = state.date||'';
    qs('#f-start').value = state.start||'';
    qs('#f-finish').value = state.finish||'';
    qs('#f-safety').value = state.safety||'';
    qs('#f-comments').value = state.comments||'';
    qs('#f-lab').value = state.lab||'';
    qs('#f-production').value = state.production||'';
    document.querySelectorAll('.task-row').forEach(function(row){
      var key = row.dataset.task;
      var t = state.priorityTasks[key] || {checked:false, notes:""};
      row.querySelector('.task-check').checked = !!t.checked;
      row.querySelector('.task-note').value = t.notes || '';
      row.classList.toggle('checked', !!t.checked);
    });

    document.querySelectorAll('.workload-opt').forEach(function(btn){
      btn.classList.toggle('active', state.workload && state.workload.status === btn.dataset.v);
    });

    /* KPI section paused — restore this loop along with the HTML/CSS/state.kpi block to bring gauges back:
    ['brewhouse','fermentation'].forEach(function(row){
      document.querySelectorAll('tr[data-row="'+row+'"] .gauge').forEach(function(g, idx){
        var cols = ['XPA','CPT','IPA','HAZY','EAZY'];
        var v = state.kpi[row][cols[idx]] || 'pending';
        g.dataset.state = v;
        g.querySelector('.state').textContent =
          v==='pass' ? 'IN SPEC' : v==='watch' ? 'WATCH' : v==='fail' ? 'OUT' : '—';
      });
    });
    */

    renderAttendance();
    var d = new Date(state.updatedAt || Date.now());
    if(state.updatedAt){
      qs('#lastSaved').textContent = 'Updated ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    }
  }

  function reconcilePriorityTasks(obj){
    obj = (obj && typeof obj === 'object') ? obj : {};
    var result = {};
    TASK_TYPES.forEach(function(t){
      result[t.key] = obj[t.key] || {checked:false, notes:""};
    });
    return result;
  }

  function reconcileAttendance(list){
    list = Array.isArray(list) ? list : [];
    var byName = {};
    list.forEach(function(p){ if(p && p.name){ byName[p.name.trim().toLowerCase()] = p; } });
    var rosterLower = ROSTER.map(function(n){ return n.toLowerCase(); });
    var result = ROSTER.map(function(name){
      var existing = byName[name.toLowerCase()];
      return { name:name, present: existing ? !!existing.present : false, roster:true };
    });
    list.forEach(function(p){
      if(p && p.name && rosterLower.indexOf(p.name.trim().toLowerCase()) === -1){
        result.push({ name:p.name, present:!!p.present, roster:false });
      }
    });
    return result;
  }

  function renderAttendance(){
    var wrap = document.getElementById('attendanceRow');
    wrap.innerHTML = '';
    (state.attendance||[]).forEach(function(person, i){
      var chip = document.createElement('div');
      chip.className = 'chip' + (person.present ? ' present' : '');
      var initials = (person.name||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();
      var rmHtml = person.roster ? '' : '<button class="rm" aria-label="Remove">×</button>';
      chip.innerHTML = '<span class="avatar">'+initials+'</span><span class="nm"></span>'+rmHtml;
      chip.title = person.roster ? 'Click to mark present / absent' : 'Click to mark present / absent — × to remove';
      chip.querySelector('.nm').textContent = person.name;
      chip.addEventListener('click', function(e){
        if(e.target.classList.contains('rm')){
          state.attendance.splice(i,1);
        } else {
          person.present = !person.present;
        }
        markDirty(); renderAttendance();
      });
      wrap.appendChild(chip);
    });
  }

  /* ---------------- Wiring inputs ---------------- */
  function bindText(id, path){
    qs(id).addEventListener('input', function(e){
      state[path] = e.target.value;
      markDirty();
    });
  }
  bindText('#f-lead','lead');
  bindText('#f-date','date');
  bindText('#f-start','start');
  bindText('#f-finish','finish');
  bindText('#f-safety','safety');
  bindText('#f-comments','comments');
  bindText('#f-lab','lab');
  bindText('#f-production','production');
  document.querySelectorAll('.task-row').forEach(function(row){
    var key = row.dataset.task;
    var check = row.querySelector('.task-check');
    var note = row.querySelector('.task-note');
    check.addEventListener('change', function(){
      if(!state.priorityTasks[key]) state.priorityTasks[key] = {checked:false, notes:""};
      state.priorityTasks[key].checked = check.checked;
      row.classList.toggle('checked', check.checked);
      markDirty();
    });
    note.addEventListener('input', function(){
      if(!state.priorityTasks[key]) state.priorityTasks[key] = {checked:false, notes:""};
      state.priorityTasks[key].notes = note.value;
      markDirty();
    });
    // Clicking the row label (not the checkbox/input directly) toggles the checkbox naturally
    // via the native <label> behavior — no extra handler needed.
  });

  document.querySelectorAll('.workload-opt').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.workload.status = btn.dataset.v;
      markDirty(); render();
    });
  });

  /* KPI section paused — restore this listener along with the HTML/CSS/state.kpi block to bring gauges back:
  var GAUGE_CYCLE = ['pending','pass','watch','fail'];
  document.querySelectorAll('.gauge').forEach(function(g, idx){
    g.addEventListener('click', function(){
      var row = g.closest('tr').dataset.row;
      var cols = ['XPA','CPT','IPA','HAZY','EAZY'];
      var col = cols[idx % 5];
      var cur = state.kpi[row][col] || 'pending';
      var next = GAUGE_CYCLE[(GAUGE_CYCLE.indexOf(cur)+1) % GAUGE_CYCLE.length];
      state.kpi[row][col] = next;
      markDirty(); render();
    });
  });
  */

  document.getElementById('addAttendee').addEventListener('click', function(){
    var name = prompt('Attendee name?');
    if(name && name.trim()){
      var trimmed = name.trim();
      var exists = (state.attendance||[]).some(function(p){
        return p.name.toLowerCase() === trimmed.toLowerCase();
      });
      if(exists){ alert(trimmed+' is already on the list.'); return; }
      state.attendance.push({name:trimmed, present:false, roster:false});
      markDirty(); renderAttendance();
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(confirm('Clear the run sheet for a new meeting?')){
      state = defaultState();
      markDirty(); render();
    }
  });

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function buildPrintSheet(){
    var workloadLabel = {none:'No problem', consistent:'Consistent', busy:'Going to be busy'}[state.workload.status] || 'Not set';
    var attendeesHtml = (state.attendance||[]).map(function(p){
      return '<li>'+ (p.present ? '☑' : '☐') + ' ' + escapeHtml(p.name) + '</li>';
    }).join('') || '<li>No attendees recorded</li>';

    var tasksHtml = TASK_TYPES.map(function(t){
      var task = state.priorityTasks[t.key] || {checked:false, notes:""};
      var mark = task.checked ? '☑' : '☐';
      var notes = task.notes ? ' — '+escapeHtml(task.notes) : '';
      return '<li>'+mark+' '+escapeHtml(t.label)+notes+'</li>';
    }).join('');

    var metaHtml =
      '<span><strong>Lead:</strong> '+escapeHtml(state.lead||'—')+'</span>' +
      '<span><strong>Date:</strong> '+escapeHtml(state.date||'—')+'</span>' +
      '<span><strong>Start:</strong> '+escapeHtml(state.start||'—')+'</span>' +
      '<span><strong>Finish:</strong> '+escapeHtml(state.finish||'—')+'</span>';

    var html =
      '<h1>13:30 Handover Meeting</h1>' +
      '<div class="ps-meta">'+metaHtml+'</div>' +
      '<section class="s-safety"><h3>Safety</h3><p>'+escapeHtml(state.safety||'None noted')+'</p></section>' +
      '<section class="s-lab"><h3>Lab</h3><p>'+escapeHtml(state.lab||'None noted')+'</p></section>' +
      '<section class="s-production"><h3>Production / Maintenance / Planning</h3><p>'+escapeHtml(state.production||'None noted')+'</p></section>' +
      '<section class="s-workload"><h3>Workload</h3><p>'+escapeHtml(workloadLabel)+'</p></section>' +
      '<section class="s-comments"><h3>Comments / issues — next 24 hrs</h3><p>'+escapeHtml(state.comments||'None noted')+'</p></section>' +
      '<section class="s-priority"><h3>Prioritized tasks</h3><ul class="ps-attendees">'+tasksHtml+'</ul></section>' +
      '<section class="s-attendance"><h3>Attendance</h3><ul class="ps-attendees">'+attendeesHtml+'</ul></section>' +
      '<div class="ps-footer">Generated '+new Date().toLocaleString()+'</div>';

    document.getElementById('printSheet').innerHTML = html;
  }

  document.getElementById('pdfBtn').addEventListener('click', function(){
    buildPrintSheet();
    window.print();
  });

  function buildEmailText(){
    var taskLines = TASK_TYPES
      .map(function(t){ return {label:t.label, task: state.priorityTasks[t.key] || {checked:false, notes:""}}; })
      .filter(function(x){ return x.task.checked; })
      .map(function(x){ return '[x] '+x.label + (x.task.notes ? ' — '+x.task.notes : ''); })
      .join('\n');
    var attendanceLines = (state.attendance||[])
      .filter(function(p){ return p.present; })
      .map(function(p){ return '- '+p.name; })
      .join('\n');
    var workloadLabel = {consistent:'Consistent', busy:'Going to be busy'}[state.workload.status];

    var lines = [
      '13:30 HANDOVER MEETING',
      'Lead: '+(state.lead||'—')+'   Date: '+(state.date||'—')+'   Start: '+(state.start||'—')+'   Finish: '+(state.finish||'—'),
      ''
    ];
    if((state.safety||'').trim()){ lines.push('SAFETY', state.safety, ''); }
    if((state.lab||'').trim()){ lines.push('LAB', state.lab, ''); }
    if((state.production||'').trim()){ lines.push('PRODUCTION / MAINTENANCE / PLANNING', state.production, ''); }
    if(workloadLabel){ lines.push('WORKLOAD: '+workloadLabel, ''); }
    if((state.comments||'').trim()){ lines.push('COMMENTS / ISSUES — NEXT 24 HRS', state.comments, ''); }
    if(taskLines){ lines.push('PRIORITIZED TASKS', taskLines, ''); }
    if(attendanceLines){ lines.push('ATTENDANCE', attendanceLines, ''); }
    if(lines.length === 3){ lines.push('(Nothing has been filled in yet.)'); }

    while(lines.length && lines[lines.length-1] === '') lines.pop();
    return lines.join('\n');
    /* KPI section paused — to bring KPI results back into this export, rebuild kpiLines
       (see buildPrintSheet for the pattern) and insert a "KPI — SPEC COMPLIANCE" block above. */
  }

  function buildEmailHtml(){
    var workloadLabel = {consistent:'Consistent', busy:'Going to be busy'}[state.workload.status];
    var FONT = "Lexend, Arial, Helvetica, sans-serif";
    var MONO = "'Courier New', Courier, monospace";

    var p = 'style="font-family:'+FONT+';font-size:13px;line-height:1.55;margin:0;color:#0B0B0C;white-space:pre-wrap;"';
    var muted = 'style="font-family:'+FONT+';font-size:13px;line-height:1.55;margin:0;color:#9c9887;font-style:italic;"';

    function card(title, barColor, innerHtml){
      return ''
        + '<div style="border:1px solid #E7E5DE;border-radius:12px;overflow:hidden;margin:0 0 14px;background:#ffffff;">'
        + '<div style="height:4px;line-height:4px;font-size:0;background-color:'+barColor+';">&nbsp;</div>'
        + '<div style="padding:12px 16px 14px;">'
        + '<div style="font-family:'+FONT+';font-size:12.5px;font-weight:700;color:#0B0B0C;margin:0 0 8px;letter-spacing:.01em;">'+escapeHtml(title)+'</div>'
        + innerHtml
        + '</div></div>';
    }

    var checkedTasks = TASK_TYPES
      .map(function(t){ return {label:t.label, task: state.priorityTasks[t.key] || {checked:false, notes:""}}; })
      .filter(function(x){ return x.task.checked; });

    var taskItems = checkedTasks.map(function(x){
      var notes = x.task.notes ? ' — '+escapeHtml(x.task.notes) : '';
      return '<div style="font-family:'+FONT+';font-size:13px;line-height:1.7;margin:0;color:#0B0B0C;">'
        + '<span style="color:#1f7a5c;font-weight:700;">&#10003;</span> <strong>'+escapeHtml(x.label)+'</strong>'+notes+'</div>';
    }).join('');

    var presentAttendees = (state.attendance||[]).filter(function(pers){ return pers.present; });
    var attendanceItems = presentAttendees.map(function(pers){
      return '<span style="display:inline-block;background:#e7f9f3;border:1.5px solid #47D7AC;color:#14523d;'
        + 'border-radius:999px;padding:5px 11px;margin:0 6px 6px 0;font-family:'+FONT+';font-size:12px;font-weight:600;">'
        + escapeHtml(pers.name)+'</span>';
    }).join('');

    var metaHtml = ''
      + '<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 14px;">'
      + '<tr>'
      + metaCell('Lead', state.lead) + metaCell('Date', state.date)
      + metaCell('Start', state.start) + metaCell('Finish', state.finish)
      + '</tr></table>';

    function metaCell(label, value){
      return '<td style="padding:0 18px 0 0;font-family:'+FONT+';">'
        + '<div style="font-family:'+MONO+';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#7a776c;">'+label+'</div>'
        + '<div style="font-family:'+FONT+';font-size:14px;font-weight:600;color:#0B0B0C;">'+escapeHtml(value||'—')+'</div>'

  document.getElementById('exportBtn').addEventListener('click', async function(){
    var btn = this;
    var label = document.getElementById('exportBtnLabel');
    var originalLabel = label.textContent;
    var text = buildEmailText();
    var html = buildEmailHtml();

    try{
      if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/html': new Blob([html], {type:'text/html'}),
            'text/plain': new Blob([text], {type:'text/plain'})
          })
        ]);
      } else {
        await navigator.clipboard.writeText(text);
      }
      label.textContent = 'Copied ✓ — paste into email';
    }catch(e){
      try{
        await navigator.clipboard.writeText(text);
        label.textContent = 'Copied ✓ — paste into email';
      }catch(e2){
        label.textContent = 'Could not copy — select & copy manually';
      }
    }
    setTimeout(function(){ label.textContent = originalLabel; }, 2400);
  });

  /* ---------------- Sync loop ---------------- */
  function markDirty(){
    dirty = true;
    state.updatedAt = Date.now();
    saveLocal();
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushRemote, 800);
  }

  async function pushRemote(){
    try{
      await remoteSet(state);
      dirty = false;
      setSyncStatus('live', 'Live — synced');
    }catch(e){
      setSyncStatus('local', 'Offline — saved on this device');
    }
  }

  async function pollRemote(){
    if(dirty) return;
    try{
      var remote = await remoteGet();
      if(remote && remote.updatedAt && remote.updatedAt > (state.updatedAt||0)){
        state = Object.assign(defaultState(), remote);
        state.attendance = reconcileAttendance(state.attendance);
        state.priorityTasks = reconcilePriorityTasks(state.priorityTasks);
        if(!state.date) state.date = todayStr();
        saveLocal();
        render();
      }
      setSyncStatus('live', 'Live — synced');
    }catch(e){
      setSyncStatus('local', 'Offline — saved on this device');
    }
  }

  async function initSync(){
    var cached = loadLocal();
    if(cached){
      state = Object.assign(defaultState(), cached);
      state.attendance = reconcileAttendance(state.attendance);
      state.priorityTasks = reconcilePriorityTasks(state.priorityTasks);
      if(!state.date) state.date = todayStr();
      render();
    }

    try{
      var remote = await remoteGet();
      if(remote){
        if(!cached || (remote.updatedAt||0) >= (cached.updatedAt||0)){
          state = Object.assign(defaultState(), remote);
        }
      }
      state.attendance = reconcileAttendance(state.attendance);
      state.priorityTasks = reconcilePriorityTasks(state.priorityTasks);
      if(!state.date) state.date = todayStr();
      render();
      saveLocal();
      setSyncStatus('live', 'Live — synced');
      markDirty();
    }catch(e){
      setSyncStatus('local', 'Offline — saved on this device');
    }

    setInterval(pollRemote, 4000);
  }

  render();
  initSync();

})();
